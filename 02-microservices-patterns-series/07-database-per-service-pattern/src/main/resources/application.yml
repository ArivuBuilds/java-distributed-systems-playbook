server:
  port: 8087

spring:
  application:
    name: database-per-service-pattern
  datasource:
    url: jdbc:h2:mem:orders_bounded_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

downstream:
  catalog-service-uri: http://localhost:9601