apiVersion: v1
kind: Pod
metadata:
  name: order-service-pod
  labels:
    app: order-service
    service: order-mesh-node
spec:
  containers:
    # 1. Main Application Container
    - name: order-application
      image: hashicorp/http-echo:0.2.3
      args:
        - "-listen=:8080"
        - "-text=Status: OK from Application Pod"
      ports:
        - containerPort: 8080
          name: http-local
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

    # 2. Sidecar Envoy Proxy Container
    - name: envoy-sidecar
      image: envoyproxy/envoy:v1.30.1
      command: ["/usr/local/bin/envoy"]
      args:
        - "-c"
        - "/etc/envoy/envoy.yaml"
        - "--service-cluster"
        - "order-service"
      ports:
        - containerPort: 10000
          name: mtls-ingress
        - containerPort: 9901
          name: envoy-admin
      volumeMounts:
        - name: envoy-config-volume
          mountPath: /etc/envoy
          readOnly: true
        - name: envoy-certs-volume
          mountPath: /etc/envoy/certs
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

  volumes:
    - name: envoy-config-volume
      configMap:
        name: envoy-sidecar-config
    - name: envoy-certs-volume
      secret:
        secretName: order-service-mtls-certs
