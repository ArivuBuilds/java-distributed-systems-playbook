server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        # Step 1: Carved out Modern Microservice Route (High Priority)
        - id: modern-auth-service-route
          uri: http://modern-auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0
            - AddResponseHeader=X-Routed-By, Modern-Auth-Microservice

        # Step 2: Fallback Route to Legacy Monolith (Catches remaining traffic)
        - id: legacy-monolith-fallback-route
          uri: http://legacy-monolith:8082
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=0
            - AddResponseHeader=X-Routed-By, Legacy-Monolith-System