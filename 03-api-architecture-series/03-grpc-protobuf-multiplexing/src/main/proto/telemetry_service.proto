syntax = "proto3";

package com.arivubuilds.api.grpc;

option java_multiple_files = true;
option java_package = "com.arivubuilds.api.grpc";
option java_outer_classname = "TelemetryProto";

service TelemetryService {
  // Unary RPC: Single request, single response
  rpc CollectMetric (MetricPayload) returns (MetricAck);

  // Server Streaming RPC: Single subscription request, stream of telemetry metrics
  rpc StreamLiveMetrics (SubscriptionFilter) returns (stream MetricPayload);
}

message MetricPayload {
  string device_id = 1;
  int64 timestamp_epoch_ms = 2;
  double cpu_load_percentage = 3;
  double memory_used_mb = 4;
  map<string, string> tags = 5;
}

message MetricAck {
  string status = 1;
  int64 recorded_at = 2;
}

message SubscriptionFilter {
  string environment = 1;
  int32 max_events = 2;
}